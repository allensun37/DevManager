openapi: 3.0.3
info:
  title: DevManager HTTP API
  version: 0.8.0
  description: Local project-management API exposed by DevManager.
servers:
  - url: http://127.0.0.1:8080

# Contract: GET /api/projects
# Contract: POST /api/projects
# Contract: PUT /api/projects/{id}
# Contract: DELETE /api/projects/{id}
# Contract: GET /health
# Contract: GET /ready
# Contract: GET /api/info
# Contract: GET /api/statistics
paths:
  /api/projects:
    get:
      operationId: listProjects
      summary: List, search, filter, or sort projects
      description: >-
        Returns all projects when no query is supplied. At most one of name, technology, and status
        may be supplied; sort may be combined with one filter and orders the resulting list in
        ascending order. Sort and pagination may be combined with that single filter. The optional
        page and size integer parameters enable pagination; if either
        is supplied, the response remains a JSON array and exposes X-Total-Count, X-Page, and
        X-Page-Size response headers. When one is omitted, page defaults to 1 and size defaults to
        20. Without page or size, the array response is compatible with v0.4. The JSON/SQLite
        backends apply the same filtering, sorting, pagination, and response semantics transparently.
        Pagination metadata is carried only in headers, not an items/total envelope.
      security:
        - bearerApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: name
          in: query
          description: Case-insensitive project-name search.
          schema:
            type: string
            minLength: 1
        - name: technology
          in: query
          description: Case-insensitive technology search.
          schema:
            type: string
            minLength: 1
        - name: status
          in: query
          description: Case-insensitive status filter.
          schema:
            type: string
            minLength: 1
        - name: sort
          in: query
          description: Ascending sort key; may be combined with one filter.
          schema:
            type: string
            enum: [id, name, status]
        - name: page
          in: query
          description: One-based page number; defaults to 1 when size is supplied without page.
          schema:
            type: integer
            minimum: 1
        - name: size
          in: query
          description: Number of projects per page; defaults to 20 when page is supplied without size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: >-
            Project list as a JSON array. X-Total-Count, X-Page, and X-Page-Size are present only
            when page or size is explicitly supplied; otherwise the response is the unpaged v0.4
            array form.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
            X-Page:
              $ref: '#/components/headers/Page'
            X-Page-Size:
              $ref: '#/components/headers/PageSize'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/PersistenceFailure'

    post:
      operationId: createProject
      summary: Create a project
      security:
        - bearerApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdExhausted'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/PersistenceFailure'

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: updateProject
      summary: Replace all editable project fields
      security:
        - bearerApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project updated; the existing ID is preserved.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/InvalidRequestOrId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/PersistenceFailure'

    delete:
      operationId: deleteProject
      summary: Delete a project
      security:
        - bearerApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Project deleted; response body is empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '500':
          $ref: '#/components/responses/PersistenceFailure'

  /health:
    get:
      operationId: health
      summary: Check process health
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: HTTP process is running.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        '500':
          $ref: '#/components/responses/InternalError'

  /ready:
    get:
      operationId: readiness
      summary: Check whether the HTTP service completed initialization
      description: >-
        Public readiness probe. It returns 200 only after configuration, repository,
        migration, route, and API-key initialization complete. It does not authenticate,
        read project data, or perform a repository health check.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service is ready to accept requests.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          $ref: '#/components/responses/NotReady'

  /api/info:
    get:
      operationId: serviceInfo
      summary: Return service identity and version
      security:
        - bearerApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Service information.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/statistics:
    get:
      operationId: projectStatistics
      summary: Return aggregate project statistics
      security:
        - bearerApiKey: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Statistics computed from project copies.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/PersistenceFailure'

components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: >-
        API key loaded from DEVMANAGER_API_KEY and sent as Authorization: Bearer <API_KEY>.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Client correlation ID. If absent or invalid, the server generates one.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
    ProjectId:
      name: id
      in: path
      required: true
      description: Positive decimal project ID.
      schema:
        type: integer
        format: uint64
        minimum: 1

  headers:
    RequestId:
      description: Correlation ID used for this request.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
    TotalCount:
      description: Total number of projects matching the optional filter, before pagination.
      schema:
        type: integer
        minimum: 0
    Page:
      description: One-based page number used for the paginated response.
      schema:
        type: integer
        minimum: 1
    PageSize:
      description: Number of projects returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    WWWAuthenticate:
      description: Authentication challenge returned when the API key is missing or invalid.
      schema:
        type: string
        enum: [Bearer]

  schemas:
    Project:
      type: object
      required: [id, name, techStack, description, status]
      properties:
        id:
          type: integer
          format: uint64
          minimum: 1
          readOnly: true
        name:
          type: string
        techStack:
          type: array
          items:
            type: string
        description:
          type: string
        status:
          type: string

    ProjectInput:
      type: object
      additionalProperties: false
      required: [name, techStack, description, status]
      properties:
        name:
          type: string
        techStack:
          type: array
          items:
            type: string
        description:
          type: string
        status:
          type: string

    ServiceInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: DevManager
        version:
          type: string
          example: 0.8.0

    ProjectStatistics:
      type: object
      required: [totalProjects, status, technology]
      properties:
        totalProjects:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/CountMap'
        technology:
          $ref: '#/components/schemas/CountMap'

    CountMap:
      type: object
      additionalProperties:
        type: integer
        minimum: 1

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Unauthorized:
      description: Authentication is required for this endpoint.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: authentication required
    NotReady:
      description: Service is still starting or is stopping.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notReady:
              value:
                error:
                  code: not_ready
                  message: service is not ready
    PayloadTooLarge:
      description: The HTTP request body exceeds the global 1 MiB limit.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payloadTooLarge:
              value:
                error:
                  code: payload_too_large
                  message: request payload exceeds 1 MiB
    InvalidQuery:
      description: Query parameters are unknown, repeated, empty, or mutually exclusive.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidQuery:
              value:
                error:
                  code: invalid_query
                  message: Project query is invalid
    InvalidRequest:
      description: Request JSON is invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              value:
                error:
                  code: invalid_request
                  message: Project input is invalid
            invalidJson:
              value:
                error:
                  code: invalid_json
                  message: Request body is not valid JSON
    InvalidRequestOrId:
      description: Request JSON or path ID is invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidRequest:
              value:
                error:
                  code: invalid_request
                  message: Project input is invalid
            invalidJson:
              value:
                error:
                  code: invalid_json
                  message: Request body is not valid JSON
            invalidId:
              value:
                error:
                  code: invalid_id
                  message: Project ID is invalid
    InvalidId:
      description: Project ID is not a positive decimal integer.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidId:
              value:
                error:
                  code: invalid_id
                  message: Project ID is invalid
    ProjectNotFound:
      description: Project ID does not exist.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error:
                  code: project_not_found
                  message: Project does not exist
    IdExhausted:
      description: No project ID remains available.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            exhausted:
              value:
                error:
                  code: id_exhausted
                  message: Project ID space is exhausted
    PersistenceFailure:
      description: Project persistence failed; in-memory state is unchanged.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            persistenceFailure:
              value:
                error:
                  code: persistence_failure
                  message: Persistence operation failed
    InternalError:
      description: Unexpected server error; internal details are not exposed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internalError:
              value:
                error:
                  code: internal_error
                  message: Internal server error
